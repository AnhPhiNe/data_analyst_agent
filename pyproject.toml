[build-system]
requires = ["hatchling>=1.27", "editables>=0.5"]
build-backend = "hatchling.build"

[project]
name = "tabular-analytics-agent"
version = "0.1.0"
description = "A verifiable single-agent workspace for tabular data analysis."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "A Fee" }]
dependencies = [
  "charset-normalizer>=3.4,<4",
  "duckdb>=1.4,<2",
  "langchain-core>=1.6,<2",
  "langchain-google-genai>=4.4,<5",
  "langgraph>=1.1,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "numpy>=2.3,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.3,<4",
  "plotly>=6.3,<7",
  "pydantic>=2.12,<3",
  "python-dotenv>=1.1,<2",
  "scipy>=1.16,<2",
  "sqlglot>=29,<30",
  "streamlit>=1.50,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.18,<2",
  "pandas-stubs>=2.3,<4",
  "pytest>=8.4,<9",
  "pytest-cov>=7,<8",
  "ruff>=0.13,<1",
  "scipy-stubs>=1.16,<2",
  "types-openpyxl>=3.1,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tabular_analytics_agent"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=tabular_analytics_agent --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["tabular_analytics_agent"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "streamlit_app.py"]

[[tool.mypy.overrides]]
module = ["langchain_google_genai", "plotly.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
