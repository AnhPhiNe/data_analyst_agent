name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The same pinned constraints as the Docker image, so both resolve identical dependencies.
      - name: Install project
        run: python -m pip install --constraint constraints.txt -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Format
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy
      - name: Test
        run: python -m pytest -q -p no:cacheprovider

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the release-check image (runs every check inside it)
        run: docker build --target check .
      - name: Build the runtime image
        run: docker build --target runtime --tag tabular-analytics-agent .
